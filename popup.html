<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button
      class="refresh-btn"
      id="refreshBtn"
      title="Refresh current scan results"
    >
      Refresh
    </button>
    <h2>Link Scanner</h2>
    <div id="apiKeySection">
      <label for="apiKey">VirusTotal API Key:</label>
      <input id="apiKey" placeholder="Enter your 64-character API key" />
      <button id="saveKey">Save</button>
    </div>
    <div id="result">
      <div class="status">
        <div class="status-circle invalid" id="statusCircle"></div>
        <span id="status">No scan performed</span>
      </div>
      <p class="scanned-url" id="scannedUrl"></p>
      <a class="cleaned-url" id="cleanedUrl" target="_blank"></a>
      <div id="detectionSummary"></div>
      <div id="analysisTime"></div>
      <a id="vtLink" target="_blank" rel="noopener noreferrer"></a>
      <div id="caution"></div>
      <p class="message" id="message">
        Right-click on any link and select "Scan Link with VirusTotal" to check
        if it's safe.
      </p>
    </div>
    <div class="footer">
      <small>Right-click any link → "Scan Link with VirusTotal"</small>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
